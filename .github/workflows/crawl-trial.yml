# 试跑：在 GitHub 托管机（海外 IP）上全量采集，只看各来源能否采全、用时和内存；数据只留在这台临时机器上，不发布、不部署、不提交。
# 手动触发。keys 默认 ALL（全部来源，强制全量）；也可填空格分隔的来源 key 只跑几个。
name: crawl-trial
on:
  workflow_dispatch:
    inputs:
      keys: { description: '来源 key，空格分隔；ALL 表示全部', required: true, default: 'ALL' }
permissions:
  contents: read
jobs:
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: machine
        run: |
          nproc; free -m | sed -n 1,2p; node --version; google-chrome --version
          # 与服务器相同：临时机器上以 --no-sandbox 启动 Chrome。
          printf '#!/bin/sh\nexec /usr/bin/google-chrome --no-sandbox --disable-dev-shm-usage "$@"\n' | sudo tee /usr/local/bin/chrome-ns >/dev/null
          sudo chmod +x /usr/local/bin/chrome-ns
      - name: crawl
        env:
          CHROME_PATH: /usr/local/bin/chrome-ns
          KEYS: ${{ inputs.keys }}
        run: |
          ( while true; do echo "$(date +%T) $(free -m | awk '/Mem:/{print "used="$3"MB avail="$7"MB"}')" >> mem.log; sleep 30; done ) &
          if [ "$KEYS" = "ALL" ]; then node crawler/update.js --full; else node crawler/update.js --full $KEYS; fi
      - name: summary
        if: always()
        run: |
          node - <<'EOF'
          const fs = require('fs'), path = require('path'), out = 'crawler/out';
          const runs = new Map(); try { for (const l of fs.readFileSync(path.join(out, 'logs/runs.jsonl'), 'utf8').trim().split('\n')) { const r = JSON.parse(l); runs.set(r.key, r); } } catch {}
          const rows = [];
          for (const f of fs.readdirSync(out).filter(f => f.endsWith('_status.json')).sort()) {
            const s = JSON.parse(fs.readFileSync(path.join(out, f), 'utf8')), snap = path.join(out, s.key + '_snapshot.json');
            let total = null; try { total = JSON.parse(fs.readFileSync(snap, 'utf8')).jobs.length; } catch {}
            rows.push({ key: s.key, status: s.status, total, seconds: runs.get(s.key)?.seconds ?? null, message: String(s.message || '').slice(0, 120) });
          }
          fs.writeFileSync('trial-counts.json', JSON.stringify(rows, null, 1));
          const md = ['| 来源 | 状态 | 岗位数 | 秒 | 说明 |', '|---|---|---|---|---|', ...rows.map(r => `| ${r.key} | ${r.status} | ${r.total ?? ''} | ${r.seconds ?? ''} | ${r.message.replace(/\|/g, '/')} |`)];
          md.unshift(`成功（ready/available）${rows.filter(r => ['ready', 'available'].includes(r.status)).length} / ${rows.length}；其余：${rows.filter(r => !['ready', 'available'].includes(r.status)).map(r => r.key + ':' + r.status).join('、') || '无'}，合计岗位 ${rows.reduce((n, r) => n + (r.total || 0), 0)}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md.join('\n') + '\n');
          console.log(md.join('\n'));
          EOF
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-evidence
          path: |
            trial-counts.json
            mem.log
            crawler/out/logs/
            crawler/out/*_status.json
            crawler/out/crawl-issues.jsonl
          if-no-files-found: warn
